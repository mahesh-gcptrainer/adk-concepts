[project]
name = "multiagent-cloud-infrastructure"
version = "0.1.0"
description = "Sequential Multi-AI Agent System using Google ADK to analyze case study PDFs and generate Terraform IaC."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=2.6.0",
    "google-genai>=0.1.0",
    "pypdf>=6.20.0",
    "reportlab>=5.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
